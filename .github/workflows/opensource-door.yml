# Reusable open-source scan workflow. Host repos in OTHER accounts call this, pinned by COMMIT SHA, so
# the registry's OIDC callback can pin `job_workflow_ref` to this exact ref. The SHA pin alone does NOT
# authorize an ingest: the registry's single-use `scan_run` token does (app/api/ingest/opensource-scan).
# It clones a PUBLIC repo tokenless at the pinned commit, runs the SAME pinned engine image the private
# door uses (no licence), and POSTs the engine share envelope to the opensource callback with a GitHub
# OIDC id-token. runs-on is GitHub-hosted so a caller cannot route the run to a runner it controls.
#
# The scan flags, provenance verify, OSS tool runs, normalize, OIDC mint and POST now live in the three
# LOCAL composite actions (.github/actions/run-engine, run-tool, build-and-post), shared byte-for-byte
# with the private door (spec 2026-11-16-one-scan-path). This door keeps ONLY its door-specific steps:
# the tokenless clone, the progress pings, and the container-name heartbeat ticker.
#
# SECURITY: the engine image, the engine memory, the ingest audience and the callback URL are HARDCODED
# below, NOT caller inputs. The caller workflow lives in the initiator's own host repo, so if any of these
# were an input the initiator could point the scan at a forged engine and post a fabricated result into
# the SHARED open-source dossier. Only the scan TARGET (repo, commit, scan_run_id) comes from the caller,
# and the registry verifies repo/commit against its own scan_run row. Bump the engine digest in the ONE
# ENGINE_IMAGE env below and re-pin OPENSOURCE_REUSABLE + INGEST_OPENSOURCE_WORKFLOW_REF to the new commit
# SHA together.
#
# JOBS (#319, epic #310 - mirrors the private door's W1 + W2):
#   scan              clone -> run-engine (verify provenance + run) -> share+findings artifact.
#   tools-trivy       OSS deploy scanner, PARALLEL to scan (own tokenless clone), soft-fails to `skipped`.
#   tools-zizmor      workflow scanner, PARALLEL to scan, soft-fails to `skipped`.
#   tools-qscan       post-quantum crypto scanner, PARALLEL to scan, soft-fails to `skipped`.
#   tools-trivy-sbom  engine-BOM CVE scanner, runs AFTER scan (needs its BOM), soft-fails to `skipped`.
#   upload            needs all four; folds the scanners into a SEPARATE tool `envelope` with the engine's
#                     `normalize` and POSTs the callback. The scanners NEVER block the core upload: `upload`
#                     runs whenever `scan` succeeded, whatever the scanners did, and the envelope is best-effort.
# The scanners add ~no wall-clock (they run beside the engine, the long pole) and send nothing out on
# their own: only `upload` posts, in one authed call, exactly as before plus the optional envelope key.
name: SettleTop Open-Source Door
on:
  workflow_call:
    inputs:
      repo:
        description: owner/name of the public repo to scan
        required: true
        type: string
      commit:
        description: the pinned commit SHA to scan
        required: true
        type: string
      scan_run_id:
        description: the registry's single-use scan_run token
        required: true
        type: string

# Hardcoded, NOT caller inputs (see the SECURITY note above). Shared by `scan` and `upload`.
env:
  ENGINE_IMAGE: ghcr.io/settletop-inc/dossier-engine@sha256:39c19bd943d2201c7e781323e4c52972454044af7f898105891758b6276b797a
  ENGINE_COMMIT: "" # engine source commit for run_meta; empty records "Unknown"
  ENGINE_MEMORY: 4g
  INGEST_AUDIENCE: https://ingest.settletop.com
  TRIVY_VERSION: "0.76.2" # TODO(infra): bump to the current Trivy release; keep in step with the private door
  ZIZMOR_VERSION: "1.32.0" # TODO(infra): bump to the current zizmor release; keep in step with the private door
  QSCAN_VERSION: "0.12.0" # TODO(infra): bump to the current @quantakrypto/qscan release; keep in step with the private door
  CALLBACK_URL: https://registry.settletop.com/api/ingest/opensource-scan
  # Live-progress ping endpoint. The open-source run lives in the host repo, so GitHub's
  # workflow_run webhook never reaches the scanned-repo scan_run row; these pings move the bar.
  # Authorized by the single-use scan_run token in the body (repo/commit matched server-side),
  # NOT OIDC: the result callback keeps full OIDC, so the hardened `scan` job needs no id-token.
  PROGRESS_URL: https://registry.settletop.com/api/ingest/opensource-scan/progress

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # scan (core): clone -> run-engine (provenance verify + pinned engine run) ->
  # share+findings transfer artifact that `upload` posts. run-engine holds the scan
  # flags; this job keeps only the tokenless clone, the progress pings, and the
  # container-name heartbeat ticker.
  # ---------------------------------------------------------------------------
  scan:
    runs-on: ubuntu-latest # GitHub-hosted only: a caller cannot route this to a runner it controls
    timeout-minutes: 30
    permissions:
      packages: read # run-engine's `gh attestation verify` reads the engine image's attestation from GHCR
    outputs:
      report-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      run-started-at: ${{ steps.runstart.outputs.at }}
    steps:
      - name: Mark run start (#330 whole-run wall -> run_meta.total_ms)
        id: runstart
        # github.run_started_at is not a real context field (resolves empty). Stamp the job start as a
        # job output so the upload job (a separate job) can read it; $GITHUB_ENV would not cross jobs.
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Validate the scan target
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          [[ "$INPUT_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "repo must be owner/name"
          [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || fail "commit must be a hex SHA"

      - name: Progress cloning
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          PHASE: cloning
        run: |
          set -uo pipefail # best effort: a ping must NEVER fail a scan
          jq -n --arg srid "$SCAN_RUN_ID" --arg repo "$INPUT_REPO" --arg commit "$INPUT_COMMIT" --arg phase "$PHASE" \
            '{scan_run_id:$srid, subject:{repo:$repo, commit:$commit}, phase:$phase}' > progress.json
          curl -sS --proto '=https' --tlsv1.2 --max-time 20 -X POST \
            -H 'Content-Type: application/json' --data-binary @progress.json "$PROGRESS_URL" > /dev/null || true

      - name: Clone the public repo (tokenless) at the pinned commit
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          t0=$(date +%s%3N) # #382 clone wall; passed to run-engine as fetch_ms
          # Clone into `src` so run-engine mounts /work/src (the basename names the subject; keeping
          # `src` keeps today's /work/src so facts_sha256 does not move).
          git init -q src
          git -C src remote add origin "https://github.com/${INPUT_REPO}.git"
          git -C src -c protocol.version=2 fetch -q --depth 1 origin "${INPUT_COMMIT}"
          git -C src checkout -q FETCH_HEAD
          echo "CLONE_MS=$(( $(date +%s%3N) - t0 ))" >> "$GITHUB_ENV"

      - name: Progress analyzing
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          PHASE: analyzing
        run: |
          set -uo pipefail # best effort: a ping must NEVER fail a scan
          jq -n --arg srid "$SCAN_RUN_ID" --arg repo "$INPUT_REPO" --arg commit "$INPUT_COMMIT" --arg phase "$PHASE" \
            '{scan_run_id:$srid, subject:{repo:$repo, commit:$commit}, phase:$phase}' > progress.json
          curl -sS --proto '=https' --tlsv1.2 --max-time 20 -X POST \
            -H 'Content-Type: application/json' --data-binary @progress.json "$PROGRESS_URL" > /dev/null || true

      - name: Start the analyze heartbeat ticker (background, container-tied)
        # #318 pair (registry PR #1006): analyze is the long SILENT phase, so with no ping the reaper's
        # no-heartbeat clock would fail a live run. While the engine CONTAINER run-engine will create is
        # running, POST an `analyzing` ping (same body/url/token as the progress steps) every ~90s. The
        # container name is deterministic from the same runner vars run-engine uses, so the door finds it
        # with `docker inspect`. Tied to the container, never a shell PID: a vanished/exited container
        # stops the beats, so a dead engine is no longer masked; a true in-container hang keeps
        # State.Running=true and is left to the job timeout / registry's 45-min ceiling. The ticker is
        # backgrounded (nohup/disown) so this step ends while it runs beside run-engine, and the job end
        # reaps it. Best effort: a ping must NEVER fail the scan.
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
        run: |
          set -uo pipefail
          # The ticker outlives this step (it beats while the separate run-engine step holds the
          # container), so it runs as a detached `nohup bash` reading a written script. CNAME is the only
          # value it needs that is not already exported: INPUT_REPO/INPUT_COMMIT/SCAN_RUN_ID come from the
          # step env, PROGRESS_URL from the workflow env, RUNNER_TEMP from the runner. Export CNAME and the
          # forked bash inherits them all (no var-assignment prefix, which shellcheck flags SC2097/SC2098).
          export CNAME="dossier-engine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/heartbeat.sh" <<'HB'
          set -uo pipefail
          while true; do
            sleep 90
            [ "$(docker inspect -f '{{.State.Running}}' "$CNAME" 2>/dev/null)" = "true" ] || continue
            jq -n --arg srid "$SCAN_RUN_ID" --arg repo "$INPUT_REPO" --arg commit "$INPUT_COMMIT" \
              '{scan_run_id:$srid, subject:{repo:$repo, commit:$commit}, phase:"analyzing"}' > "$RUNNER_TEMP/hb.json"
            curl -sS --proto '=https' --tlsv1.2 --max-time 20 --retry 2 -X POST \
              -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/hb.json" "$PROGRESS_URL" > /dev/null || true
          done
          HB
          nohup bash "$RUNNER_TEMP/heartbeat.sh" > /dev/null 2>&1 &
          disown

      - name: Run the dossier engine
        id: engine
        uses: SettleTop-Inc/settletop-dossier-workflow/.github/actions/run-engine@33c2625cdc680f71da690d7646599b36453212be
        with:
          engine_image: ${{ env.ENGINE_IMAGE }}
          engine_memory: ${{ env.ENGINE_MEMORY }}
          engine_commit: ${{ env.ENGINE_COMMIT }}
          source_dir: src
          commit: ${{ inputs.commit }}
          require_licence: "false"
          fetch_ms: ${{ env.CLONE_MS }}
          fetch_kind: clone
          gh_token: ${{ github.token }}

      - name: Pass the report on (1-day artifact)
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dossier-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.engine.outputs.out-dir }}
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # tools-trivy / tools-zizmor / tools-qscan (#317 applied to the open-source door). Own tokenless
  # clone, run PARALLEL to `scan`, every tool error soft-fails to status `skipped` inside run-tool.
  # They send nothing out; `upload` folds their output into the tool envelope.
  # ---------------------------------------------------------------------------
  tools-trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read # authed ghcr pull of the Trivy vuln-DB (dodge the anon rate limit)
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Validate the scan target
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          [[ "$INPUT_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "repo must be owner/name"
          [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || fail "commit must be a hex SHA"

      - name: Clone the public repo (tokenless) at the pinned commit
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git init -q clone
          git -C clone remote add origin "https://github.com/${INPUT_REPO}.git"
          git -C clone -c protocol.version=2 fetch -q --depth 1 origin "${INPUT_COMMIT}"
          git -C clone checkout -q FETCH_HEAD

      - name: Run the OSS scanner (trivy)
        uses: SettleTop-Inc/settletop-dossier-workflow/.github/actions/run-tool@33c2625cdc680f71da690d7646599b36453212be
        with:
          tool: trivy
          source_dir: clone
          trivy_version: ${{ env.TRIVY_VERSION }}

      - name: Pass the tool output on (1-day artifact)
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dossier-tools-trivy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error # tools-trivy.json is always written, so this never trips

  tools-zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Validate the scan target
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          [[ "$INPUT_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "repo must be owner/name"
          [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || fail "commit must be a hex SHA"

      - name: Clone the public repo (tokenless) at the pinned commit
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git init -q clone
          git -C clone remote add origin "https://github.com/${INPUT_REPO}.git"
          git -C clone -c protocol.version=2 fetch -q --depth 1 origin "${INPUT_COMMIT}"
          git -C clone checkout -q FETCH_HEAD

      - name: Run the OSS scanner (zizmor)
        uses: SettleTop-Inc/settletop-dossier-workflow/.github/actions/run-tool@33c2625cdc680f71da690d7646599b36453212be
        with:
          tool: zizmor
          source_dir: clone
          zizmor_version: ${{ env.ZIZMOR_VERSION }}

      - name: Pass the tool output on (1-day artifact)
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dossier-tools-zizmor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error # tools-zizmor.json is always written, so this never trips

  tools-qscan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Validate the scan target
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$1"; exit 1; }
          [[ "$INPUT_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || fail "repo must be owner/name"
          [[ "$INPUT_COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || fail "commit must be a hex SHA"

      - name: Clone the public repo (tokenless) at the pinned commit
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git init -q clone
          git -C clone remote add origin "https://github.com/${INPUT_REPO}.git"
          git -C clone -c protocol.version=2 fetch -q --depth 1 origin "${INPUT_COMMIT}"
          git -C clone checkout -q FETCH_HEAD

      - name: Run the OSS scanner (qscan)
        uses: SettleTop-Inc/settletop-dossier-workflow/.github/actions/run-tool@33c2625cdc680f71da690d7646599b36453212be
        with:
          tool: qscan
          source_dir: clone
          qscan_version: ${{ env.QSCAN_VERSION }}

      - name: Pass the tool output on (1-day artifact)
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dossier-tools-qscan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error # tools-qscan.json is always written, so this never trips

  # ---------------------------------------------------------------------------
  # tools-trivy-sbom (#826, epic #823). Scans the ENGINE's Trivy-facing BOM for known CVEs so
  # every versioned component carries its advisories (canonical_key = the component bom-ref =
  # Trivy's PkgIdentifier.BOMRef). Unlike tools-trivy (which scans the source clone for deploy
  # posture), this NEEDS the engine output, so it runs AFTER `scan` and downloads the report
  # artifact for bom.trivy.cdx.json (the engine's CycloneDX 1.6 BOM from --trivy-bom-out; Trivy
  # rejects the 1.7 AI-BOM). It runs in its OWN job so the authed Trivy vuln-DB pull never widens
  # the hardened `scan` job's surface. Soft-fails to `skipped` inside run-tool; `upload` folds
  # trivy-sbom.json into the envelope via normalize. It sends NOTHING out itself (only `upload` posts).
  # ---------------------------------------------------------------------------
  tools-trivy-sbom:
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: read # authed ghcr pull of the Trivy vuln-DB (dodge the anon rate limit)
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Fetch the report (for bom.trivy.cdx.json)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.scan.outputs.report-artifact-id }}
          path: report
          merge-multiple: true

      - name: Run the OSS scanner (trivy-sbom)
        uses: SettleTop-Inc/settletop-dossier-workflow/.github/actions/run-tool@33c2625cdc680f71da690d7646599b36453212be
        with:
          tool: trivy-sbom
          bom_path: report/bom.trivy.cdx.json
          trivy_version: ${{ env.TRIVY_VERSION }}

      - name: Pass the tool output on (1-day artifact)
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dossier-tools-trivy-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error # tools-trivy-sbom.json is always written, so this never trips

  # ---------------------------------------------------------------------------
  # upload (#318 applied to the open-source door). Mint the OIDC id-token, fold the
  # scanners into a SEPARATE tool `envelope` with the engine's `normalize`, and POST
  # the callback -- all inside build-and-post. `needs` the scanners only to ORDER after
  # them; `if` runs whenever `scan` succeeded, so a failed/skipped scanner never blocks
  # the core upload. The envelope is best-effort and never touches `report`/share or any
  # hash (#310/#318). This job keeps only the progress ping; build-and-post does the rest.
  # ---------------------------------------------------------------------------
  upload:
    if: ${{ !cancelled() && needs.scan.result == 'success' }}
    needs: [scan, tools-trivy, tools-zizmor, tools-trivy-sbom, tools-qscan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # mint the OIDC token the callback verifies
    steps:
      - name: Progress uploading
        env:
          INPUT_REPO: ${{ inputs.repo }}
          INPUT_COMMIT: ${{ inputs.commit }}
          SCAN_RUN_ID: ${{ inputs.scan_run_id }}
          PHASE: uploading
        run: |
          set -uo pipefail # best effort: a ping must NEVER fail a scan
          jq -n --arg srid "$SCAN_RUN_ID" --arg repo "$INPUT_REPO" --arg commit "$INPUT_COMMIT" --arg phase "$PHASE" \
            '{scan_run_id:$srid, subject:{repo:$repo, commit:$commit}, phase:$phase}' > progress.json
          curl -sS --proto '=https' --tlsv1.2 --max-time 20 -X POST \
            -H 'Content-Type: application/json' --data-binary @progress.json "$PROGRESS_URL" > /dev/null || true

      - name: Build and post the dossier
        uses: SettleTop-Inc/settletop-dossier-workflow/.github/actions/build-and-post@33c2625cdc680f71da690d7646599b36453212be
        with:
          door: opensource
          callback_url: ${{ env.CALLBACK_URL }}
          audience: ${{ env.INGEST_AUDIENCE }}
          engine_image: ${{ env.ENGINE_IMAGE }}
          report_artifact_id: ${{ needs.scan.outputs.report-artifact-id }}
          tools_artifact_pattern: dossier-tools-*-${{ github.run_id }}-${{ github.run_attempt }}
          subject_json: '{"repo":${{ toJSON(inputs.repo) }},"commit":${{ toJSON(inputs.commit) }},"unit_path":null}'
          run_started_at: ${{ needs.scan.outputs.run-started-at }}
          max_envelope_bytes: "4194304" # 4 MiB. The whole POST body stays under this.
          scan_run_id: ${{ inputs.scan_run_id }}
